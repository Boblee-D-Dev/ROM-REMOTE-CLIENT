# Included from http {} (e.g. /etc/nginx/conf.d/) — ALOG-5 edge JSONL-friendly access log.
# Apply: sync-nginx.sh (proxy role) copies this file on deploy.

log_format moon_proxy_track escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"request":"$request",'
    '"status":$status,'
    '"request_uri":"$request_uri",'
    '"http_user_agent":"$http_user_agent",'
    '"http_origin":"$http_origin",'
    '"http_sec_ch_ua_mobile":"$http_sec_ch_ua_mobile",'
    '"http_sec_ch_ua_platform":"$http_sec_ch_ua_platform",'
    '"http_sec_ch_ua":"$http_sec_ch_ua",'
    '"http_sec_ch_ua_model":"$http_sec_ch_ua_model",'
    '"http_sec_ch_ua_platform_version":"$http_sec_ch_ua_platform_version",'
    '"http_sec_ch_ua_arch":"$http_sec_ch_ua_arch",'
    '"arg_login_id":"$arg_login_id",'
    '"arg_game_id":"$arg_game_id",'
    '"arg_ch_mobile":"$arg_ch_mobile",'
    '"upstream_status":"$upstream_status",'
    '"body_bytes_sent":$body_bytes_sent'
  '}';
